version: '3.8'

services:
  backend:
    image: ${BACKEND_IMAGE:-shixun-backend}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shixun-backend
    ports:
      - "${BACKEND_PORT:-30211}:8080"
    volumes:
      - ./mock-data:/app/mock-data:ro
      - sqlite-data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/training.db
      - LLM_PROXY_URL=https://llm-proxy.densematrix.ai
      - LLM_PROXY_KEY=${LLM_PROXY_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-3-flash-preview}
      - SECRET_KEY=${SECRET_KEY:-liaoning-railway-training-demo-only-change-in-production}
      - MOCK_DATA_DIR=/app/mock-data
      - DEBUG=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - shixun-net

  frontend:
    image: ${FRONTEND_IMAGE:-shixun-frontend}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shixun-frontend
    ports:
      - "${FRONTEND_PORT:-30210}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - shixun-net

networks:
  shixun-net:
    driver: bridge

volumes:
  sqlite-data:
