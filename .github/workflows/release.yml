name: Offline release validation
on:
  push:
    branches: ['release/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest --cov=app --cov-fail-under=95 -q
        working-directory: backend
      - run: npm ci --no-audit --no-fund && npm run test:coverage && npm run build
        working-directory: frontend
      - run: bash -n deploy/offline/*.sh scripts/build_offline_bundle.sh
      - run: docker build -f Dockerfile.offline -t liaogui-release-test .
      - name: Air-gapped bootstrap
        run: |
          docker run -d --name offline-test --network none -e SECRET_KEY=isolated-ci-only-secret-at-least-32-characters -e BOOTSTRAP_ADMIN_PASSWORD=isolated-ci-password-only-123 liaogui-release-test
          for attempt in $(seq 1 30); do
            if docker exec offline-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"; then exit 0; fi
            sleep 2
          done
          docker logs offline-test
          exit 1
      - name: Offline installer and restart persistence
        run: |
          mkdir -p "$RUNNER_TEMP/install-bundle"
          cp deploy/offline/* "$RUNNER_TEMP/install-bundle/"
          printf '%s\n' liaogui-release-test > "$RUNNER_TEMP/install-bundle/IMAGE"
          docker save liaogui-release-test | gzip -1 > "$RUNNER_TEMP/install-bundle/image.tar.gz"
          cd "$RUNNER_TEMP/install-bundle"
          sha256sum image.tar.gz > SHA256SUMS
          DOCKER_NETWORK=none CONTAINER_NAME=installer-check bash install.sh
          CONTAINER_NAME=installer-check bash backup.sh
          CONTAINER_NAME=installer-check bash stop.sh
          DOCKER_NETWORK=none CONTAINER_NAME=installer-check bash start.sh
          docker exec installer-check python -c "import sqlite3; c=sqlite3.connect('/data/training.db'); assert c.execute('select count(*) from users').fetchone()[0]==1"
      - name: Synthetic 140-student integration and 50-user load
        run: docker exec -e RELEASE_SMOKE_ALLOWED=true -e SMOKE_LOAD_SECONDS=60 -i installer-check python - < scripts/release_smoke.py
      - name: Save reproducible measurements
        if: always()
        run: |
          mkdir -p artifacts/ci
          docker cp installer-check:/data/release-smoke-result.json artifacts/ci/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-release-verification
          path: artifacts/ci/
