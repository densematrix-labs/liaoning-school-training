server {
    listen 80;
    server_name shixun.demo.densematrix.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name shixun.demo.densematrix.ai;

    ssl_certificate /etc/letsencrypt/live/shixun.demo.densematrix.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shixun.demo.densematrix.ai/privkey.pem;

    # Frontend
    location / {
        proxy_pass http://127.0.0.1:30210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:30211;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:30211;
    }
}
